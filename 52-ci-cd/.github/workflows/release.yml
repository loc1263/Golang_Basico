# Tema 52: release automático. Al pushear un tag con formato de versión:
#   git tag v1.2.3 && git push origin v1.2.3
# GoReleaser compila para todas las plataformas, genera los .tar.gz/.zip,
# los checksums y el changelog, y crea el Release en GitHub.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # necesario para crear el Release y subir los archivos

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial completo: GoReleaser arma el changelog con los commits

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tests antes de publicar
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --config 52-ci-cd/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # lo provee GitHub automáticamente
